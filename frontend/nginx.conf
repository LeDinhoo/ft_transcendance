# Configuration Nginx avec HTTPS vers le backend

# Définition de l'upstream pour le backend
upstream backend_django {
    server backend:8443;  # Adresse du backend Django sur HTTPS
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Configuration SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/gunicorn.crt;
    ssl_certificate_key /etc/nginx/certs/gunicorn.key;

    ssl_prefer_server_ciphers on;
    ssl_ciphers 'HIGH:!aNULL:!MD5';

    # Redirection des requêtes principales vers le frontend (HTML)
    location / {
        root /usr/share/nginx/html;  # Chemin vers les fichiers HTML
        index index.html;
        try_files $uri $uri/ /index.html;  # Redirige vers index.html si l'URI n'existe pas
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";  # Pas de mise en cache
        expires -1;
    }

    # Configuration des shaders et utils pour servir correctement les fichiers JS
    location /static/spa/game/shaders/ {
        alias /usr/share/nginx/html/static/spa/game/libs/;  # Chemin réel vers les shaders
        types {
            application/javascript js;
        }
        default_type application/javascript;
    }

    location /static/spa/game/utils/ {
        alias /usr/share/nginx/html/static/spa/game/libs/;  # Chemin réel vers les utilitaires
        types {
            application/javascript js;
        }
        default_type application/javascript;
    }

    # Redirection vers le fichier game.html pour le chemin /game/
    location /game/ {
        root /usr/share/nginx/html;
        try_files /game.html =404;  # Sert le fichier game.html
    }

    # Proxy pass pour l'API backend via HTTPS
    location /api/ {
        proxy_pass https://backend:8443;  # Redirige les requêtes API vers le backend Django
        proxy_ssl_verify off;  # Désactive la vérification SSL pour les certificats auto-signés

        # Réglages pour augmenter la taille des requêtes uploadées et des buffers
        client_max_body_size 20M;  # Taille maximale du corps de la requête (ex: upload d'images)
        client_body_buffer_size 10M;  # Taille maximale du buffer mémoire pour les requêtes

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Servir les fichiers statiques (CSS, JS, images) à partir du frontend
    location /static/ {
        alias /usr/share/nginx/html/static/;  # Chemin des fichiers statiques dans Nginx
        expires 30d;
        add_header Cache-Control "public";
    }

    # Servir les fichiers média (uploadés par les utilisateurs)
    location /media/ {
        alias /app/media/;  # Chemin vers le volume partagé dans le conteneur Nginx
        autoindex on;  # Optionnel : permet de lister les fichiers (utile en développement)
        expires 30d;
        add_header Cache-Control "public";
    }

    # WebSocket proxy configuration for game
    location /wss/ {
        proxy_pass https://backend:8443;
        proxy_http_version 1.1;
        
        # WebSocket specific settings
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy settings
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for long-running connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Favicon
    location = /favicon.ico {
        alias /usr/share/nginx/html/static/assets/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # Pages d'erreur personnalisées (désactivées si inutiles)
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
