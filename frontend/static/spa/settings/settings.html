
<div class="mainSettings">
  <div class="settingsWrapper">
  <div class="settingsContent">
    <div class="leftSettings">
      <div class="settings-group">
        <h2 class="settings-title" data-translate="game_settings">Game Settings</h2>

        <div class="setting-item">
		  <span class="setting-label" data-translate="score_to_win">Score to Win</span>
          <div class="options-group">
            <button class="option-button" data-setting="score" data-translate="score_1">1</button>
			<button class="option-button" data-setting="score" data-translate="score_1">3</button>
			<button class="option-button" data-setting="score" data-translate="score_1">5</button>
			<button class="option-button" data-setting="score" data-translate="score_1">10</button>
			<button class="option-button" data-setting="score" data-translate="score_1">15</button>
          </div>
        </div>

        <div class="setting-item">
			<span class="setting-label" data-translate="ball_slower">Ball Slower during Serve</span>
          <div class="options-group">
            <button class="option-button" data-setting="ballSlower" data-translate="yes">Yes</button>
            <button class="option-button" data-setting="ballSlower" data-translate="yes">No</button>
          </div>
        </div>

        <div class="setting-item">
		  <span class="setting-label" data-translate="who_starts">Who starts after a Point</span>
          <div class="options-group">
            <button class="option-button" data-setting="starter" data-translate="player_1">Player 1</button>
            <button class="option-button" data-setting="starter" data-translate="alternate">Alternate</button>
            <button class="option-button" data-setting="starter" data-translate="player_2">Player 2</button>
          </div>
        </div>

        <div class="setting-item">
		  <span class="setting-label" data-translate="power_mode">Power Mode</span>
          <div class="options-group">
            <button class="option-button" data-setting="powerMode" data-translate="yes">Yes</button>
            <button class="option-button" data-setting="powerMode" data-translate="no">No</button>
          </div>
        </div>

        <div class="setting-item">
		  <span class="setting-label" data-translate="ia_difficulty">IA Difficulty</span>
          <div class="options-group">
            <button class="option-button" data-setting="difficulty" data-translate="easy">Easy</button>
            <button class="option-button" data-setting="difficulty" data-translate="medium">Medium</button>
            <button class="option-button" data-setting="difficulty" data-translate="hard">Hard</button>
          </div>
        </div>
      </div>
    </div>

    <div class="rightSettings">
      <div class="settings-group">
        <h2 class="settings-title" data-translate="controls_settings">Controls Settings</h2>

        <div class="controls-section">
          <div class="player-controls">
            <h3 class="controls-subtitle" data-translate="player_1">Player 1</h3>
            <div class="setting-item">
			  <span class="setting-label" data-translate="movement">Movement</span>
              <div class="controls-group">
                <div class="control-input">
				  <label data-translate="move_up">Move Up</label>
                  <input
                    type="text"
                    class="key-input"
                    data-control="p1-up"
                    readonly
                    placeholder="Press a key"
                    value="W"
                  />
                </div>
                <div class="control-input">
				  <label data-translate="move_down">Move Down</label>
                  <input
                    type="text"
                    class="key-input"
                    data-control="p1-down"
                    readonly
                    placeholder="Press a key"
                    value="S"
                  />
                </div>
              </div>
            </div>

            <div class="setting-item">
			  <span class="setting-label" data-translate="powers">Powers</span>
              <div class="controls-group">
                <div class="control-input">
				  <label data-translate="flash_power">Flash Power</label>
                  <input
                    type="text"
                    class="key-input"
                    data-control="p1-power-flash"
                    readonly
                    placeholder="Press a key"
                    value="Q"
                  />
                </div>
                <div class="control-input">
				  <label data-translate="laser_power">Laser Power</label>
                  <input
                    type="text"
                    class="key-input"
                    data-control="p1-power-laser"
                    readonly
                    placeholder="Press a key"
                    value="E"
                  />
                </div>
                <div class="control-input">
				  <label data-translate="multiball_power">Multiball Power</label>
                  <input
                    type="text"
                    class="key-input"
                    data-control="p1-power-multi"
                    readonly
                    placeholder="Press a key"
                    value="R"
                  />
                </div>
              </div>
            </div>
          </div>

          <div class="player-controls">
            <h3 class="controls-subtitle" data-translate="player_1">Player 2</h3>
            <div class="setting-item">
			  <span class="setting-label" data-translate="movement">Movement</span>
              <div class="controls-group">
                <div class="control-input">
				  <label data-translate="move_up">Move Up</label>
                  <input
                    type="text"
                    class="key-input"
                    data-control="p2-up"
                    readonly
                    placeholder="Press a key"
                    value="↑"
                  />
                </div>
                <div class="control-input">
				  <label data-translate="move_down">Move Down</label>
                  <input
                    type="text"
                    class="key-input"
                    data-control="p2-down"
                    readonly
                    placeholder="Press a key"
                    value="↓"
                  />
                </div>
              </div>
            </div>

            <div class="setting-item">
			  <span class="setting-label" data-translate="powers">Powers</span>
              <div class="controls-group">
                <div class="control-input">
				  <label data-translate="flash_power">Flash Power</label>
                  <input
                    type="text"
                    class="key-input"
                    data-control="p2-power-flash"
                    readonly
                    placeholder="Press a key"
                    value="I"
                  />
                </div>
                <div class="control-input">
				  <label data-translate="laser_power">Laser Power</label>
                  <input
                    type="text"
                    class="key-input"
                    data-control="p2-power-laser"
                    readonly
                    placeholder="Press a key"
                    value="O"
                  />
                </div>
                <div class="control-input">
				  <label data-translate="multiball_power">Multiball Power</label>
                  <input
                    type="text"
                    class="key-input"
                    data-control="p2-power-multi"
                    readonly
                    placeholder="Press a key"
                    value="P"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>


  </div>

  <div class="saveSettings">
    <button class="save-button" data-translate="save">SAVE</button>
  </div>
</div>
</div>

  </div>
